                    const todaySubs = rankSubs.filter(item => {
                        if (!item.submitted_at) return false;
                        const d = new Date(item.submitted_at);
                        return d.toDateString() === today;
                    });
                    const countMap = new Map();
                    todaySubs.forEach(item => {
                        const cls = item.class || '';
                        const name = item.name || '';
                        if (!cls || !name) return;
                        const key = `${cls}|${name}`;
                        if (!whiteSet.has(key)) return;
                        if (!countMap.has(key)) {
                            countMap.set(key, { class: cls, name: name, count: 0 });
                        }
                        countMap.get(key).count++;
                    });
                    const sorted = Array.from(countMap.values()).sort((a, b) => b.count - a.count);
                    rankData = sorted;
                    renderRankList(sorted);
                })
                .catch(err => {
                    console.error('排行榜加载失败', err);
                    rankList.innerHTML = '<div class="rank-empty">加载失败，请刷新重试</div>';
                });
            }

            function renderRankList(data) {
                if (!data || data.length === 0) {
                    rankList.innerHTML = '<div class="rank-empty">今日暂无排行榜数据</div>';
                    return;
                }
                let html = '';
                data.forEach((item, index) => {
                    const pos = index + 1;
                    const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : `#${pos}`;
                    html += `
                        <div class="rank-item">
                            <span class="rank-pos">${medal}</span>
                            <span class="rank-name">${item.name}</span>
                            <span class="rank-class">${item.class}</span>
                            <span class="rank-score">${item.count} 组</span>
                        </div>
                    `;
                });
                rankList.innerHTML = html;
            }

            // ---------- 15. 绑定控件 ----------
            document.getElementById('resetPosBtn').addEventListener('click', resetPieces);
            document.getElementById('resetViewBtn').addEventListener('click', resetView);
            document.getElementById('zoomInBtn').addEventListener('click', () => changeZoom(1.2));
            document.getElementById('zoomOutBtn').addEventListener('click', () => changeZoom(0.8));
            document.getElementById('rotateLeftBtn').addEventListener('click', () => rotateSelected(-45));
            document.getElementById('rotateRightBtn').addEventListener('click', () => rotateSelected(45));
            document.getElementById('flipBtn').addEventListener('click', flipSelected);
            document.getElementById('submitBtn').addEventListener('click', verifyPuzzle);

            // 更换/跳过按钮：根据模式决定行为
            generateBtn.addEventListener('click', function() {
                if (isExamMode && examActive) {
                    // 答题模式下：跳过本题（不计数）
                    generateNewPuzzle(true);
                } else {
                    // 非答题模式：更换
                    generateNewPuzzle(false);
                }
            });

            // 点击结束答题：直接退出，不弹确认框
            examBtn.addEventListener('click', function() {
                if (examActive) {
                    // 直接结束，无确认对话框
                    endExam();
                } else {
                    document.getElementById('examModal').classList.add('active');
                }
            });

            document.getElementById('startExamBtn').addEventListener('click', startExam);
            document.getElementById('closeModalBtn').addEventListener('click', function() {
                document.getElementById('examModal').classList.remove('active');
            });
            document.getElementById('examModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });

            document.getElementById('rankRefreshBtn').addEventListener('click', fetchRankData);

            svgElem.addEventListener('mousedown', startPan);
            svgElem.addEventListener('touchstart', startPan, { passive: false });
            svgElem.addEventListener('wheel', handleWheel, { passive: false });

            let lastTap = 0;
            document.addEventListener('touchend', (e) => {
                let now = Date.now();
                let diff = now - lastTap;
                if (diff < 300 && e.target.closest('.draggable-group')) {
                    let id = e.target.closest('.draggable-group').id;
                    if (transforms[id]) { rotatePiece(document.getElementById(id), 45); }
                }
                lastTap = now;
            }, { passive: false });

            // 初始化
            setTimeout(() => {
                generateNewPuzzle(false);
                fetchRankData();
            }, 100);
            updateViewport();
            updateStats();
        })();
    </script>
</body>
</html>
